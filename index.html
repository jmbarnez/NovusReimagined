    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;

        overflow: hidden;

  <body>
    <div id="loading">
      <div class="cockpit-stars"></div>

      <div class="cockpit-dashboard">
        <!-- MONITOR 1 (LEFT/CENTER): Primary Interface & Loading Bar -->
        <div class="cockpit-monitor monitor-center">
          <div class="monitor-bezel-line"></div>
          <div class="monitor-header">
            <span class="monitor-tag">MON-1 // PRIMARY</span>
            <span class="monitor-title">NEURAL LINK PROCESSOR</span>
          </div>
          <div class="monitor-content">
            <div class="ld-title">NOVUS</div>
            <div class="ld-sep"></div>
            <div id="ld-sub" class="ld-sub">Initializing system core...</div>

            <!-- Styled visual loading progress bar -->
            <div class="ld-progress-bar">
              <div class="ld-progress-fill" style="width: 0%;"></div>
            </div>

            <!-- Title screen menu buttons (hidden during loading) -->
            <div class="ld-menu-actions">
              <button type="button" id="title-sp" class="ld-btn-start">PLAY</button>
              <button type="button" id="title-mp" class="ld-btn-start ld-btn-secondary">JOIN</button>
              <div class="title-icon-row">
                <button type="button" id="title-settings" class="ld-btn-start ld-btn-settings title-settings-icon" aria-label="Open settings">⚙</button>
                <button type="button" id="title-exit" class="ld-btn-start ld-btn-danger title-exit-icon" aria-label="Exit">⏻</button>
              </div>
            </div>
            <div class="title-build-label">v0.2.0 / BUILD 8</div>
          </div>
        </div>
        
        <!-- MONITOR 2 (RIGHT): System Console & Telemetry Stats -->
        <div class="cockpit-monitor monitor-right">
          <div class="monitor-bezel-line"></div>
          <div class="monitor-header">
            <span class="monitor-tag">MON-2 // LOGS</span>
            <span class="monitor-title">SYSTEM CONSOLE DIAGNOSTICS</span>
          </div>
          <div class="monitor-content">
            <div class="ld-console" aria-hidden="true">
              <div class="ld-console-line">&gt; Initializing pilot interface...</div>
            </div>
            <div class="boot-telemetry boot-perf-monitor" aria-label="Performance monitor">
              <div class="boot-perf-head">
                <span class="boot-perf-title">LIVE PERFORMANCE</span>
                <span class="boot-perf-state" id="boot-perf-state">STANDBY</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-lbl" data-perf-label="fps">FPS</span>
                <span class="telemetry-val" id="boot-perf-fps">0</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-lbl" data-perf-label="frame">FRAME AVG / MAX</span>
                <span class="telemetry-val" id="boot-perf-frame">0.0 / 0.0 MS</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-lbl" data-perf-label="ticks">TICKS / FRAME</span>
                <span class="telemetry-val" id="boot-perf-ticks">0.0</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-lbl" data-perf-label="entities">ENTITIES</span>
                <span class="telemetry-val" id="boot-perf-entities">B0 E0 A0 P0</span>
              </div>
              <div class="telemetry-row telemetry-row-wide">
                <span class="telemetry-lbl" data-perf-label="memory">MEMORY</span>
                <span class="telemetry-val" id="boot-perf-memory">—</span>
              </div>
            </div>
          </div>
        </div>
    </div>
    </div>
    <div id="world-tutorial-layer"></div>
    <div id="hud-overlay" style="display: none;"></div>
    <div id="bridge-overlay" style="display: none;">
      <div class="bridge-backdrop" id="bridge-backdrop" aria-hidden="true"></div>
      <div class="bridge-workspace" id="bridge-workspace">
        <div id="bridge-toast" class="bridge-toast" aria-live="polite"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
